[project]
name = "zizi-preprocess"
version = "0.0.1"
description = "DICOM → .raw + manifest.json preprocessor for zizi"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pydicom>=3.0",
]

[project.optional-dependencies]
itk = ["SimpleITK>=2.4"]
dev = ["pytest>=8.0"]

[project.scripts]
preprocess = "preprocess:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["preprocess.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
